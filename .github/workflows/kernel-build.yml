name: Ishtar GKI control build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ishtar-gki-${{ github.ref }}
  cancel-in-progress: false

env:
  GKI_WORKSPACE: /tmp/gki-build
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Check build inputs
        run: |
          python3 .github/workflows/scripts/build.py --no-release --dry-run
          python3 -m unittest discover -s .github/workflows/scripts/tests -v

      - name: Prepare runner
        run: |
          set -euo pipefail
          sudo systemctl stop systemd-oomd 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/vcpkg
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache git curl wget zip unzip xz-utils openssl patch rsync bc bison flex libssl-dev libelf-dev
          git config --global user.email 'gki-builder@localhost'
          git config --global user.name 'GKI Builder'
          git config --global --add safe.directory '*'

      - name: Build kernel
        run: python3 .github/workflows/scripts/build.py --workspace "$GKI_WORKSPACE" --no-release

      - name: Package build outputs
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "$GKI_WORKSPACE/android13-5.15-211/Image" artifacts/Image
          cp "$GKI_WORKSPACE/android13-5.15-211/manifest.lock.xml" artifacts/manifest.lock.xml
          cp "$GKI_WORKSPACE/BUILD_INFO.md" artifacts/BUILD_INFO.md
          find "$GKI_WORKSPACE" -type f -name 'android*-boot.img' -exec cp {} artifacts/ \;
          find "$GKI_WORKSPACE" -type f -name 'android*-AnyKernel3.zip' -exec cp {} artifacts/ \;
          test -f artifacts/android13-5.15.211-2026-09-lz4kd-bbr3-sukisu-stable-boot.img
          test -f artifacts/android13-5.15.211-2026-09-lz4kd-bbr3-sukisu-stable-AnyKernel3.zip
          (cd artifacts && sha256sum Image *.img *.zip manifest.lock.xml BUILD_INFO.md > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: ishtar-gki-f3-control
          path: artifacts/*
          if-no-files-found: error

      - name: Upload failure info
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ishtar-gki-f3-failure-${{ github.run_id }}
          path: |
            ${{ env.GKI_WORKSPACE }}/BUILD_INFO.md
            ${{ env.GKI_WORKSPACE }}/**/*.rej
          if-no-files-found: warn
