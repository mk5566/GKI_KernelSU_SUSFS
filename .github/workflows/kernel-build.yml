name: Kernel Build

on:
  workflow_dispatch:
    inputs:
      sukisu_channel:
        description: SukiSU upstream channel
        required: true
        type: choice
        options: [stable, dev]
        default: stable
      bbr_version:
        description: TCP BBR implementation
        required: true
        type: choice
        options: [v1, v3]
        default: v3
      apply_tweaks:
        description: Apply the complete tweak patch set
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.ref }}-${{ inputs.sukisu_channel }}-${{ inputs.bbr_version }}-${{ inputs.apply_tweaks }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GKI_WORKSPACE: /tmp/gki-build
      INPUT_SUKISU_CHANNEL: ${{ inputs.sukisu_channel }}
      INPUT_BBR_VERSION: ${{ inputs.bbr_version }}
      INPUT_APPLY_TWEAKS: ${{ inputs.apply_tweaks }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl zip unzip xz-utils openssl rsync bc bison flex \
            libssl-dev libelf-dev lz4 kmod zstd cpio
          df -h . /tmp
      - name: Run builder tests
        run: python3 -m unittest discover -s .github/workflows/scripts/tests -v
      - name: Integrate and validate exact source stack, then compile
        shell: bash
        run: |
          set -euo pipefail
          args=(--sukisu-channel "$INPUT_SUKISU_CHANNEL" --bbr-version "$INPUT_BBR_VERSION" --workspace "$GKI_WORKSPACE")
          if [[ "$INPUT_APPLY_TWEAKS" == "true" ]]; then
            args+=(--apply-tweaks)
          else
            args+=(--no-tweaks)
          fi
          python3 .github/workflows/scripts/build.py "${args[@]}"
      - name: Prepare artifact name and files
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          stem="$(tr -d '\n' < "$GKI_WORKSPACE/artifact_stem.txt")"
          echo "name=$stem" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts
          find "$GKI_WORKSPACE" -type f \( -name '*-AnyKernel3.zip' -o -name '*-boot.img' \) -exec cp {} artifacts/ \;
          cp "$GKI_WORKSPACE/BUILD_INFO.md" artifacts/
          compgen -G 'artifacts/*-AnyKernel3.zip' >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: artifacts/*
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-failed-${{ github.run_id }}
          path: |
            /tmp/gki-build/BUILD_INFO.md
            /tmp/gki-build/android13-5.15/out/android13-5.15/common/.config
            /tmp/gki-build/**/*.rej
          if-no-files-found: warn
