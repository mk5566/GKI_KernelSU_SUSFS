name: Kernel Build

on:
  workflow_dispatch:
    inputs:
      sukisu_channel:
        description: SukiSU source (both choices follow latest upstream; kernel and manager UAPI must match)
        required: true
        type: choice
        options: [stable, dev]
        default: stable

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.ref }}-${{ inputs.sukisu_channel }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GKI_WORKSPACE: /tmp/gki-build
      INPUT_SUKISU_CHANNEL: ${{ inputs.sukisu_channel }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl zip unzip xz-utils openssl rsync bc bison flex \
            libssl-dev libelf-dev lz4 kmod zstd cpio
          df -h . /tmp
      - name: Reserve memory for full LTO with GKI BTF metadata
        shell: bash
        run: |
          set -euo pipefail
          sudo fallocate -l 12G /tmp/gki-link.swap
          sudo chmod 600 /tmp/gki-link.swap
          sudo mkswap /tmp/gki-link.swap
          sudo swapon /tmp/gki-link.swap
          free -h
      - name: Resolve current dependencies once
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/workflows/scripts/build.py --resolve-only \
            --sukisu-channel "$INPUT_SUKISU_CHANNEL" --workspace "$GKI_WORKSPACE"
      - name: Run builder tests
        shell: bash
        run: |
          set -euo pipefail
          commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sukisu_commit"])' "$GKI_WORKSPACE/sources.json")"
          git init "$RUNNER_TEMP/sukisu-upstream"
          git -C "$RUNNER_TEMP/sukisu-upstream" fetch --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git "$commit"
          git -C "$RUNNER_TEMP/sukisu-upstream" checkout --detach FETCH_HEAD
          GKI_TEST_NETWORK=1 GKI_TEST_SOURCES="$GKI_WORKSPACE/sources.json" \
            SUKISU_TEST_SOURCE="$RUNNER_TEMP/sukisu-upstream" \
            python3 -m unittest discover -s .github/workflows/scripts/tests -v
      - name: Integrate the resolved source stack and compile
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/workflows/scripts/build.py \
            --sources "$GKI_WORKSPACE/sources.json" \
            --workspace "$GKI_WORKSPACE"
      - name: Publish boot.img and AnyKernel3.zip
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "$GKI_WORKSPACE/boot.img" artifacts/boot.img
          cp "$GKI_WORKSPACE/AnyKernel3.zip" artifacts/AnyKernel3.zip
          find artifacts -type f -printf '%p\n' | sort
          test "$(find artifacts -type f | wc -l)" -eq 2
          name="$(tr -d '\r\n' < "$GKI_WORKSPACE/artifact_stem.txt")"
          test -n "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.publish.outputs.name }}
          path: |
            artifacts/boot.img
            artifacts/AnyKernel3.zip
          if-no-files-found: error
      - name: Upload successful build evidence
        uses: actions/upload-artifact@v7
        with:
          name: kernel-evidence-${{ github.run_id }}
          path: /tmp/gki-build/evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Summarize verified build
        run: cat "$GKI_WORKSPACE/evidence/BUILD_INFO.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failure diagnostics
        # Paths follow GKI_WORKSPACE; the build subdirectory is the builder's
        # configured family name (scripts/config.py ANDROID_FAMILY).
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-failed-${{ github.run_id }}
          include-hidden-files: true
          path: |
            ${{ env.GKI_WORKSPACE }}/BUILD_INFO.md
            ${{ env.GKI_WORKSPACE }}/sources.json
            ${{ env.GKI_WORKSPACE }}/GKI-reference.symvers
            ${{ env.GKI_WORKSPACE }}/CONFIG_REPORT.json
            ${{ env.GKI_WORKSPACE }}/checkouts.json
            ${{ env.GKI_WORKSPACE }}/android13-5.15/out/android13-5.15/common/.config
            ${{ env.GKI_WORKSPACE }}/android13-5.15/out/android13-5.15/common/Module.symvers
            ${{ env.GKI_WORKSPACE }}/android13-5.15/out/android13-5.15/dist/vmlinux.symvers
            ${{ env.GKI_WORKSPACE }}/**/*.rej
          if-no-files-found: warn
