name: Kernel Build

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'SukiSU UAPI 4 + SUSFS (Dev: latest main; Stable: pinned known revision)'
        required: true
        type: choice
        options:
          - Stable(standard)
          - Dev(development)
        default: Dev(development)
      kernelsu_commit:
        description: 'Specify KernelSU commit hash (Optional)'
        required: false
        type: string
        default: ''
      susfs_commit:
        description: 'Specify SUSFS commit hash (Optional)'
        required: false
        type: string
        default: ''
      custom_version:
        description: 'Custom Version Name (Optional)'
        required: false
        type: string
        default: ''
      use_zram:
        description: 'Request native ZSTD; requires a validated zRAM deployment'
        required: true
        type: boolean
        default: false
      set_defbbr:
        description: 'Select upstream BBRv1 default'
        required: true
        type: boolean
        default: false
      make_release:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: false
      send_telegram:
        description: 'Send Telegram Notification'
        required: true
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.10'
  GKI_WORKSPACE: /tmp/gki-build
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      sublevel: ${{ steps.target.outputs.sublevel }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Test source selection and manager compatibility
        run: python3 -m unittest discover -s .github/workflows/scripts/tests -v

      - name: Resolve latest Android 13 GKI 5.15 target
        id: target
        run: |
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, ".github/workflows/scripts")
          from target import resolve_latest_target_selection
          selection = resolve_latest_target_selection()
          target_file = Path(os.environ["RUNNER_TEMP"]) / "gki-target-selection.json"
          selection.write(target_file)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"GKI_TARGET_FILE={target_file}\n")
              env.write(f"RESOLVED_SUBLEVEL={selection.sublevel}\n")
              env.write(f"RESOLVED_OS_PATCH={selection.month}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"sublevel={selection.sublevel}\n")
          PY

      - name: Validate target and patches
        env:
          INPUT_CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
          INPUT_KERNELSU_COMMIT: ${{ github.event.inputs.kernelsu_commit }}
          INPUT_KERNELSU_VERSION: ${{ github.event.inputs.kernelsu_version }}
          INPUT_SET_DEFBBR: ${{ github.event.inputs.set_defbbr }}
          INPUT_SUSFS_COMMIT: ${{ github.event.inputs.susfs_commit }}
          INPUT_USE_ZRAM: ${{ github.event.inputs.use_zram }}
        run: |
          set -euo pipefail
          cd ./.github/workflows/scripts
          extra=()
          [ "${INPUT_USE_ZRAM}" = "true" ] && extra+=(--zram) || extra+=(--no-zram)
          [ "${INPUT_SET_DEFBBR}" = "true" ] && extra+=(--bbr) || extra+=(--no-bbr)
          [ -z "${INPUT_KERNELSU_COMMIT}" ] || extra+=(--ksu-commit="${INPUT_KERNELSU_COMMIT}")
          [ -z "${INPUT_SUSFS_COMMIT}" ] || extra+=(--susfs-commit="${INPUT_SUSFS_COMMIT}")
          [ -z "${INPUT_CUSTOM_VERSION}" ] || extra+=(--custom-version="${INPUT_CUSTOM_VERSION}")
          python3 build.py \
            --android android13 \
            --kernel 5.15 \
            --target-file "${GKI_TARGET_FILE}" \
            --ksu-version "${INPUT_KERNELSU_VERSION}" \
            "${extra[@]}" \
            --dry-run

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache python3 git curl wget zip unzip xz-utils openssl \
            patch rsync bc bison flex libssl-dev libelf-dev

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-android13-5.15-${{ env.RESOLVED_SUBLEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-android13-5.15-${{ env.RESOLVED_SUBLEVEL }}-

      - name: Configure ccache
        run: |
          ccache --version
          ccache --max-size=3G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=1
          ccache -z
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Build kernel
        id: build
        env:
          INPUT_CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
          INPUT_KERNELSU_COMMIT: ${{ github.event.inputs.kernelsu_commit }}
          INPUT_KERNELSU_VERSION: ${{ github.event.inputs.kernelsu_version }}
          INPUT_MAKE_RELEASE: ${{ github.event.inputs.make_release }}
          INPUT_SET_DEFBBR: ${{ github.event.inputs.set_defbbr }}
          INPUT_SUSFS_COMMIT: ${{ github.event.inputs.susfs_commit }}
          INPUT_USE_ZRAM: ${{ github.event.inputs.use_zram }}
        run: |
          set -euo pipefail
          cd ./.github/workflows/scripts

          extra=()
          if [ "${INPUT_USE_ZRAM}" = "true" ]; then
            extra+=(--zram)
          else
            extra+=(--no-zram)
          fi
          if [ "${INPUT_SET_DEFBBR}" = "true" ]; then
            extra+=(--bbr)
          else
            extra+=(--no-bbr)
          fi
          [ -z "${INPUT_KERNELSU_COMMIT}" ] || extra+=(--ksu-commit="${INPUT_KERNELSU_COMMIT}")
          [ -z "${INPUT_SUSFS_COMMIT}" ] || extra+=(--susfs-commit="${INPUT_SUSFS_COMMIT}")
          [ -z "${INPUT_CUSTOM_VERSION}" ] || extra+=(--custom-version="${INPUT_CUSTOM_VERSION}")
          [ "${INPUT_MAKE_RELEASE}" = "true" ] || extra+=(--no-release)

          python3 build.py \
            --android android13 \
            --kernel 5.15 \
            --target-file "${GKI_TARGET_FILE}" \
            --ksu-version "${INPUT_KERNELSU_VERSION}" \
            --workspace "${GKI_WORKSPACE}" \
            "${extra[@]}"

      - name: Show ccache stats
        if: always()
        run: ccache -s

      - name: Save ccache
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-android13-5.15-${{ env.RESOLVED_SUBLEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prepare artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          BUILD_DIR="${GKI_WORKSPACE}/android13-5.15-${RESOLVED_SUBLEVEL}"
          STEM="$(tr -d '\r\n' < "${GKI_WORKSPACE}/artifact_stem.txt")"
          cp "${BUILD_DIR}/${STEM}-AnyKernel3.zip" artifacts/
          for name in Image final.config build.log manifest.lock.xml; do
            cp "${BUILD_DIR}/${name}" artifacts/
          done
          cp "${GKI_WORKSPACE}/BUILD_INFO.md" artifacts/
          cp "${GKI_WORKSPACE}/artifact_stem.txt" artifacts/
          cp "${GKI_TARGET_FILE}" artifacts/target-selection.json
          (cd artifacts && sha256sum Image *AnyKernel3.zip BUILD_INFO.md final.config build.log manifest.lock.xml artifact_stem.txt target-selection.json > SHA256SUMS.txt)
          ls -lh artifacts
          cat artifacts/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: kernel-android13-5.15-${{ env.RESOLVED_SUBLEVEL }}
          path: artifacts/
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-failed-android13-5.15-${{ env.RESOLVED_SUBLEVEL }}-${{ github.run_id }}
          path: |
            ${{ env.GKI_WORKSPACE }}/BUILD_INFO.md
            ${{ env.GKI_WORKSPACE }}/**/*.rej
            ${{ env.GKI_WORKSPACE }}/**/gki_defconfig
            ${{ env.GKI_WORKSPACE }}/**/build.log
            ${{ env.GKI_WORKSPACE }}/**/final.config
            ${{ env.GKI_WORKSPACE }}/**/manifest.lock.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Send Telegram Notification
        if: ${{ github.event.inputs.send_telegram == 'true' && success() }}
        env:
          INPUT_KERNELSU_VERSION: ${{ github.event.inputs.kernelsu_version }}
          INPUT_SET_DEFBBR: ${{ github.event.inputs.set_defbbr }}
          INPUT_USE_ZRAM: ${{ github.event.inputs.use_zram }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          cd ./.github/workflows/scripts
          python3 telegram_notify.py single \
            "android13" \
            "5.15" \
            "${{ env.RESOLVED_SUBLEVEL }}" \
            "${{ env.RESOLVED_OS_PATCH }}" \
            "${INPUT_KERNELSU_VERSION}" \
            "${INPUT_USE_ZRAM}" \
            "${INPUT_SET_DEFBBR}" \
            "${{ github.workspace }}/artifacts/SHA256SUMS.txt"

  release:
    if: ${{ github.event.inputs.make_release == 'true' && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@v7
        with:
          name: kernel-android13-5.15-${{ needs.build.outputs.sublevel }}
          path: artifacts

      - name: Verify checksums and create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum -c SHA256SUMS.txt)
          TAG="$(tr -d '\r\n' < artifacts/artifact_stem.txt)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --notes-file artifacts/BUILD_INFO.md
          else
            gh release create "$TAG" artifacts/* \
              --title "GKI Kernel $TAG" \
              --notes-file artifacts/BUILD_INFO.md
          fi
