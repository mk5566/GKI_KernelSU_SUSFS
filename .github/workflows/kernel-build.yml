name: Build Xiaomi 13 Ultra Kernel

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      ksu_version:
        description: 'SukiSU Version'
        required: true
        type: choice
        default: 'Stable(standard)'
        options:
          - 'Stable(standard)'
          - 'Dev(development)'

env:
  PYTHON_VERSION: '3.10'
  GKI_WORKSPACE: /tmp/gki-build
  DEBIAN_FRONTEND: noninteractive
  KSU_VERSION: ${{ github.event.inputs.ksu_version || 'Stable(standard)' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run repository safety tests
        run: python3 -m unittest discover -s .github/workflows/scripts/tests -v

      - name: Resolve latest Android 13 GKI 5.15 target
        id: target
        run: |
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, ".github/workflows/scripts")
          from target import resolve_latest_target_selection

          selection = resolve_latest_target_selection()
          target_file = Path(os.environ["RUNNER_TEMP"]) / "gki-target-selection.json"
          selection.write(target_file)

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"GKI_TARGET_FILE={target_file}\n")
              env.write(f"RESOLVED_SUBLEVEL={selection.sublevel}\n")
              env.write(f"RESOLVED_OS_PATCH={selection.month}\n")
          PY

      - name: Validate fixed ishtar profile
        run: |
          set -euo pipefail
          cd ./.github/workflows/scripts
          python3 build.py \
            --android android13 \
            --kernel 5.15 \
            --target-file "${GKI_TARGET_FILE}" \
            --ksu-version "${KSU_VERSION}" \
            --no-zram \
            --bbr \
            --optional-patches="" \
            --no-release \
            --dry-run

      - name: Maximize build space and configure swap
        run: |
          set -euo pipefail
          echo "=== Disabling systemd-oomd ==="
          sudo systemctl stop systemd-oomd 2>/dev/null || true
          sudo systemctl disable systemd-oomd 2>/dev/null || true
          sudo systemctl mask systemd-oomd 2>/dev/null || true

          echo "=== Freeing runner disk space ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/vcpkg 2>/dev/null || true

          echo "=== Setting up 16GB swap file ==="
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo sysctl -w vm.swappiness=100
          sudo sysctl -w vm.vfs_cache_pressure=50

          echo "=== Memory and disk status ==="
          free -h
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache python3 git curl wget zip unzip xz-utils openssl \
            patch rsync bc bison flex libssl-dev libelf-dev

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-android13-5.15-${{ env.RESOLVED_SUBLEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-android13-5.15-${{ env.RESOLVED_SUBLEVEL }}-

      - name: Configure ccache
        run: |
          ccache --version
          ccache --max-size=3G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=1
          ccache --set-config=hard_link=false
          ccache -z
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_NOHARDLINK=true" >> "$GITHUB_ENV"

      - name: Build fixed ishtar kernel
        id: build
        run: |
          set -euo pipefail
          cd ./.github/workflows/scripts
          python3 build.py \
            --android android13 \
            --kernel 5.15 \
            --target-file "${GKI_TARGET_FILE}" \
            --ksu-version "${KSU_VERSION}" \
            --no-zram \
            --bbr \
            --optional-patches="" \
            --no-release \
            --workspace "${GKI_WORKSPACE}"

      - name: Show ccache stats
        if: always()
        run: ccache -s

      - name: Save ccache
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' && steps.ccache.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-android13-5.15-${{ env.RESOLVED_SUBLEVEL }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prepare artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          BUILD_DIR="${GKI_WORKSPACE}/android13-5.15-${RESOLVED_SUBLEVEL}"
          STEM="$(tr -d '\r\n' < "${GKI_WORKSPACE}/artifact_stem.txt")"
          cp "${BUILD_DIR}/${STEM}-AnyKernel3.zip" artifacts/
          cp "${BUILD_DIR}/boot.img" artifacts/
          for name in Image final.config build.log manifest.lock.xml source-safety.json; do
            cp "${BUILD_DIR}/${name}" artifacts/
          done
          cp "${GKI_WORKSPACE}/BUILD_INFO.md" artifacts/
          cp "${GKI_WORKSPACE}/artifact_stem.txt" artifacts/
          cp "${GKI_TARGET_FILE}" artifacts/target-selection.json
          (cd artifacts && sha256sum Image *AnyKernel3.zip boot.img BUILD_INFO.md final.config build.log manifest.lock.xml source-safety.json artifact_stem.txt target-selection.json > SHA256SUMS.txt)
          ls -lh artifacts
          cat artifacts/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ishtar-android13-5.15-${{ env.RESOLVED_SUBLEVEL }}
          path: artifacts/
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ishtar-build-failed-${{ github.run_id }}
          path: |
            ${{ env.GKI_WORKSPACE }}/BUILD_INFO.md
            ${{ env.GKI_WORKSPACE }}/**/*.rej
            ${{ env.GKI_WORKSPACE }}/**/gki_defconfig
            ${{ env.GKI_WORKSPACE }}/**/build.log
            ${{ env.GKI_WORKSPACE }}/**/final.config
            ${{ env.GKI_WORKSPACE }}/**/manifest.lock.xml
            ${{ env.GKI_WORKSPACE }}/**/source-safety.json
          if-no-files-found: warn
          retention-days: 7
