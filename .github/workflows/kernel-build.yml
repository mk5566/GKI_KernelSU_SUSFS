name: Kernel Build

on:
  workflow_dispatch:
    inputs:
      sukisu_channel:
        description: SukiSU source. stable keeps the reviewed booting revision; dev follows upstream. Kernel UAPI follows that source.
        required: true
        type: choice
        options: [stable, dev]
        default: stable

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.ref }}-${{ inputs.sukisu_channel }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GKI_WORKSPACE: /tmp/gki-build
      INPUT_SUKISU_CHANNEL: ${{ inputs.sukisu_channel }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl zip unzip xz-utils openssl rsync bc bison flex \
            libssl-dev libelf-dev lz4 kmod zstd cpio
          df -h . /tmp
      - name: Reserve memory for full LTO with GKI BTF metadata
        shell: bash
        run: |
          set -euo pipefail
          sudo fallocate -l 12G /tmp/gki-link.swap
          sudo chmod 600 /tmp/gki-link.swap
          sudo mkswap /tmp/gki-link.swap
          sudo swapon /tmp/gki-link.swap
          free -h
      - name: Run builder tests
        run: python3 -m unittest discover -s .github/workflows/scripts/tests -v
      - name: Integrate the pinned source stack and compile
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/workflows/scripts/build.py \
            --sukisu-channel "$INPUT_SUKISU_CHANNEL" \
            --workspace "$GKI_WORKSPACE"
      - name: Publish boot.img and AnyKernel3.zip
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "$GKI_WORKSPACE/boot.img" artifacts/boot.img
          cp "$GKI_WORKSPACE/AnyKernel3.zip" artifacts/AnyKernel3.zip
          find artifacts -type f -printf '%p\n' | sort
          test "$(find artifacts -type f | wc -l)" -eq 2
          name="$(tr -d '\r\n' < "$GKI_WORKSPACE/artifact_stem.txt")"
          test -n "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.publish.outputs.name }}
          path: |
            artifacts/boot.img
            artifacts/AnyKernel3.zip
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kernel-failed-${{ github.run_id }}
          include-hidden-files: true
          path: |
            /tmp/gki-build/BUILD_INFO.md
            /tmp/gki-build/android13-5.15/out/android13-5.15/common/.config
            /tmp/gki-build/android13-5.15/out/android13-5.15/common/Module.symvers
            /tmp/gki-build/android13-5.15/out/android13-5.15/dist/vmlinux.symvers
            /tmp/gki-build/**/*.rej
          if-no-files-found: warn
