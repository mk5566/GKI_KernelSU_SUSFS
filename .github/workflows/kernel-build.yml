name: Kernel Build

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android Version'
        required: true
        type: choice
        options:
          - android13
        default: android13
      kernel_version:
        description: 'Kernel Version'
        required: true
        type: choice
        options:
          - "5.15"
        default: "5.15"
      sub_level:
        description: 'Sub Level Version'
        required: true
        type: string
        default: '180'
      os_patch_level:
        description: 'OS Patch Level'
        required: true
        type: string
        default: '2025-05'
      kernelsu_version:
        description: 'SukiSU Version'
        required: true
        type: choice
        options:
          - Stable(standard)
          - Dev(development)
        default: Stable(standard)
      kernelsu_commit:
        description: 'Specify KernelSU commit hash (Optional)'
        required: false
        type: string
        default: ''
      susfs_commit:
        description: 'Specify SUSFS commit hash (Optional)'
        required: false
        type: string
        default: ''
      custom_version:
        description: 'Custom Version Name (Optional)'
        required: false
        type: string
        default: ''
      use_zram:
        description: 'Enable ZRAM (LZ4KD)'
        required: true
        type: boolean
        default: true
      set_defbbr:
        description: 'Set BBR as Default Congestion Algorithm'
        required: true
        type: boolean
        default: true
      make_release:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: false
      send_telegram:
        description: 'Send Telegram Notification'
        required: true
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.10'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache python3 git curl wget zip unzip xz-utils openssl pixz \
            patch rsync bc bison flex libssl-dev libelf-dev
          pip install PyYAML
          git config --global user.email "gki-builder@localhost"
          git config --global user.name "GKI Builder"
          git config --global --add safe.directory '*'

      - name: Configure ccache
        run: |
          ccache --version
          ccache --max-size=5G
          ccache --set-config=compression=true
          ccache --set-config=compression_type=zstd
          ccache -z
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: android13-5.15.180-ccache-${{ github.sha }}
          restore-keys: |
            android13-5.15.180-ccache-

      - name: Build kernel
        run: |
          set -euo pipefail
          cd ./.github/workflows/scripts

          ARGS="--android ${{ github.event.inputs.android_version }}"
          ARGS="$ARGS --kernel ${{ github.event.inputs.kernel_version }}"
          ARGS="$ARGS --sub-level ${{ github.event.inputs.sub_level }}"
          ARGS="$ARGS --os-patch ${{ github.event.inputs.os_patch_level }}"
          ARGS="$ARGS --ksu-version '${{ github.event.inputs.kernelsu_version }}'"

          [ "${{ github.event.inputs.use_zram }}" = "true" ] && ARGS="$ARGS --zram"
          [ "${{ github.event.inputs.use_zram }}" = "false" ] && ARGS="$ARGS --no-zram"
          [ "${{ github.event.inputs.set_defbbr }}" = "true" ] && ARGS="$ARGS --bbr"
          [ "${{ github.event.inputs.set_defbbr }}" = "false" ] && ARGS="$ARGS --no-bbr"
          [ -z "${{ github.event.inputs.kernelsu_commit }}" ] || ARGS="$ARGS --ksu-commit=${{ github.event.inputs.kernelsu_commit }}"
          [ -z "${{ github.event.inputs.susfs_commit }}" ] || ARGS="$ARGS --susfs-commit=${{ github.event.inputs.susfs_commit }}"
          [ -z "${{ github.event.inputs.custom_version }}" ] || ARGS="$ARGS --custom-version='${{ github.event.inputs.custom_version }}'"
          [ "${{ github.event.inputs.make_release }}" = "true" ] || ARGS="$ARGS --no-release"

          python3 build.py $ARGS

      - name: Show ccache stats
        if: always()
        run: ccache -s

      - name: Prepare artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find /tmp/gki-build -type f -name "android*-boot.img" -exec cp {} artifacts/ \;
          find /tmp/gki-build -type f -name "android*-AnyKernel3.zip" -exec cp {} artifacts/ \;
          echo "Artifacts:"
          ls -lh artifacts || true
          if ! ls artifacts/*AnyKernel3.zip >/dev/null 2>&1; then
            echo "ERROR: AnyKernel3 zip was not produced"
            find /tmp/gki-build -maxdepth 3 -type f \( -name 'Image' -o -name '*.zip' -o -name '*.img' \) -print || true
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}-${{ github.event.inputs.sub_level }}
          path: artifacts/*
          if-no-files-found: error

      - name: Generate checksums
        run: |
          echo "=== Creating checksums ==="
          sha256sum artifacts/* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        if: ${{ github.event.inputs.make_release == 'true' && success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.android_version }}-${{ github.event.inputs.kernel_version }}.${{ github.event.inputs.sub_level }}-${{ github.event.inputs.os_patch_level }}"
          [ -n "${{ github.event.inputs.custom_version }}" ] && TAG="$TAG-${{ github.event.inputs.custom_version }}"
          gh release create "$TAG" artifacts/* SHA256SUMS.txt \
            --title "GKI Kernel $TAG" \
            --notes "Generic Kernel Image locked to 5.15.180 with SukiSU-Ultra, SUSFS, BBRv3, and LZ4KD ZRAM." \
            --clobber || true

      - name: Send Telegram Notification
        if: ${{ github.event.inputs.send_telegram == 'true' && success() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          cd ./.github/workflows/scripts
          python3 telegram_notify.py single \
            "${{ github.event.inputs.android_version }}" \
            "${{ github.event.inputs.kernel_version }}" \
            "${{ github.event.inputs.sub_level }}" \
            "${{ github.event.inputs.os_patch_level }}" \
            "${{ github.event.inputs.kernelsu_version }}" \
            "${{ github.event.inputs.use_zram }}" \
            "${{ github.event.inputs.set_defbbr }}" \
            "../../SHA256SUMS.txt"
