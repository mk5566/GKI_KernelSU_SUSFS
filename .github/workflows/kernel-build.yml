name: Kernel Build

on:
  workflow_dispatch:
    inputs:
      sukisu_channel:
        description: SukiSU source (both choices follow latest upstream; kernel and manager UAPI must match)
        required: true
        type: choice
        options: [stable, dev]
        default: stable

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.ref }}-${{ inputs.sukisu_channel }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GKI_WORKSPACE: /tmp/gki-build
      PYTHONUTF8: "1"
      GIT_TERMINAL_PROMPT: "0"
      INPUT_SUKISU_CHANNEL: ${{ inputs.sukisu_channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          check-latest: true
      - name: Run fast offline regression checks
        shell: bash
        run: |
          python3 -X utf8 -m unittest discover -s .github/workflows/scripts/tests -q
          bash -n .github/workflows/scripts/ci_runner.sh
          git diff --check
      - name: Resolve current dependencies once
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/workflows/scripts/build.py --resolve-only \
            --sukisu-channel "$INPUT_SUKISU_CHANNEL" --workspace "$GKI_WORKSPACE"
      - name: Install kernel build dependencies
        shell: bash
        run: bash .github/workflows/scripts/ci_runner.sh dependencies
      - name: Provision disk swap for full LTO
        shell: bash
        run: bash .github/workflows/scripts/ci_runner.sh memory
      - name: Run builder tests
        shell: bash
        run: |
          set -euo pipefail
          commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sukisu_commit"])' "$GKI_WORKSPACE/sources.json")"
          repo_url="$(python3 -c 'import sys; sys.path.insert(0,".github/workflows/scripts"); from config import KSU_REPO_CONFIG; print(KSU_REPO_CONFIG["repo_url"])')"
          git init "$RUNNER_TEMP/sukisu-upstream"
          git -C "$RUNNER_TEMP/sukisu-upstream" fetch --depth=1 "$repo_url" "$commit"
          git -C "$RUNNER_TEMP/sukisu-upstream" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/sukisu-upstream" rev-parse HEAD)" = "$commit"
          GKI_TEST_NETWORK=1 GKI_TEST_SOURCES="$GKI_WORKSPACE/sources.json" \
            GKI_REQUIRE_NATIVE=1 GKI_TEST_SANITIZERS=1 SUKISU_TEST_SOURCE="$RUNNER_TEMP/sukisu-upstream" \
            python3 -m unittest discover -s .github/workflows/scripts/tests -v
      - name: Integrate the resolved source stack and compile
        shell: bash
        env:
          MALLOC_ARENA_MAX: "2"
        run: |
          bash .github/workflows/scripts/ci_runner.sh build \
            --sources "$GKI_WORKSPACE/sources.json" \
            --workspace "$GKI_WORKSPACE"
      - name: Publish boot.img and AnyKernel3.zip
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "$GKI_WORKSPACE/boot.img" artifacts/boot.img
          cp "$GKI_WORKSPACE/AnyKernel3.zip" artifacts/AnyKernel3.zip
          find artifacts -type f -printf '%p\n' | sort
          test "$(find artifacts -type f | wc -l)" -eq 2
          name="$(tr -d '\r\n' < "$GKI_WORKSPACE/artifact_stem.txt")"
          test -n "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.publish.outputs.name }}-attempt-${{ github.run_attempt }}
          compression-level: 1
          path: |
            artifacts/boot.img
            artifacts/AnyKernel3.zip
          if-no-files-found: error
      - name: Upload successful build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.GKI_WORKSPACE }}/evidence/
          include-hidden-files: true
          if-no-files-found: error
      - name: Summarize verified build
        run: cat "$GKI_WORKSPACE/evidence/BUILD_INFO.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Record runner resource diagnostics
        if: always()
        shell: bash
        run: |
          { df -h; free -h; swapon --show; } >> "$RUNNER_TEMP/gki-runner-resources.txt" 2>&1
      - name: Upload failure diagnostics
        # Paths follow GKI_WORKSPACE; the build subdirectory is the builder's
        # configured family name (scripts/config.py ANDROID_FAMILY).
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-failed-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ env.GKI_WORKSPACE }}/BUILD_INFO.md
            ${{ runner.temp }}/gki-runner-resources.txt
            ${{ env.GKI_WORKSPACE }}/build.log
            ${{ env.GKI_WORKSPACE }}/preflight.log
            ${{ env.GKI_WORKSPACE }}/precompile.config
            ${{ env.GKI_WORKSPACE }}/CONFIG_DIFF.json
            ${{ env.GKI_WORKSPACE }}/PATCH_REPORT.json
            ${{ env.GKI_WORKSPACE }}/BUILD_TIMINGS.json
            ${{ env.GKI_WORKSPACE }}/sources.json
            ${{ env.GKI_WORKSPACE }}/GKI-reference.symvers
            ${{ env.GKI_WORKSPACE }}/CONFIG_REPORT.json
            ${{ env.GKI_WORKSPACE }}/checkouts.json
            ${{ env.GKI_WORKSPACE }}/android13-5.15/out/android13-5.15/common/.config
            ${{ env.GKI_WORKSPACE }}/android13-5.15/out/android13-5.15/common/Module.symvers
            ${{ env.GKI_WORKSPACE }}/android13-5.15/out/android13-5.15/dist/vmlinux.symvers
            ${{ env.GKI_WORKSPACE }}/**/*.rej
          if-no-files-found: warn
